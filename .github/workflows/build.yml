# Builds and tests stm-cli on every push and pull request, resolving dependencies from Maven Central only, so a
# dependency on a Chenile version that has not been released fails here.
name: Build stm-cli

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test (Maven Central only)
        run: mvn -B -ntp -Dmaven.repo.local=$RUNNER_TEMP/m2 verify
