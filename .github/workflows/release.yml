# Publishes stm-cli when a version tag is pushed (e.g. `git push origin 1.0.0`), or on demand.
# The GitHub release uses the workflow's own GITHUB_TOKEN. Updating the Homebrew formula in ajapros/homebrew-jgen-tap
# needs a repository secret JRELEASER_HOMEBREW_GITHUB_TOKEN: a fine-grained personal access token whose resource
# owner is ajapros, limited to ajapros/homebrew-jgen-tap, with "Contents: Read and write" (the same kind of token
# chenile-gen uses for JGen).
name: Release stm-cli

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (an existing tag, e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build stm-cli
        # The tag is the stm-cli version. Chenile comes from the released chenile-parent in pom.xml.
        run: mvn -B -ntp package -Drevision=${VERSION}

      - name: Check the distribution
        run: |
          test -f "target/stm-cli-${VERSION}-dist.zip"
          cp "target/stm-cli-${VERSION}-jar-with-dependencies.jar" target/stm-cli.jar
          unzip -q "target/stm-cli-${VERSION}-dist.zip" -d /tmp/stm-cli-dist
          "/tmp/stm-cli-dist/stm-cli-${VERSION}/bin/stm-cli" --version

      - name: Release
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ env.VERSION }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}

      - name: Keep JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: out/jreleaser
